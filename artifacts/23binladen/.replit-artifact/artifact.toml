kind = "web"
previewPath = "/"
title = "23 BinLaden"
version = "1.0.0"
id = "artifacts/23binladen"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21138

[services.development]
run = "pnpm --filter @workspace/23binladen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/23binladen", "run", "build" ]
serve = "static"
publicDir = "artifacts/23binladen/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21138"
BASE_PATH = "/"
